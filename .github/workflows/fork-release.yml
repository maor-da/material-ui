name: Fork release

# Build @mui/material and attach the npm tarball to a GitHub release.
# The tracker client installs the tarball from the release URL.
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The trailing `...` also builds the workspace packages that @mui/material depends on.
      - run: pnpm --filter "@mui/material..." build
      # pnpm packs publishConfig.directory (build/) and replaces the workspace:^ ranges
      # with real versions. npm pack keeps them, and Yarn cannot resolve them.
      - name: Pack
        working-directory: packages/mui-material
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A moved tag finds the release of the earlier run, so replace its tarball.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/mui-material-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/mui-material-*.tgz \
              --title "$GITHUB_REF_NAME" \
              --notes "@mui/material $GITHUB_REF_NAME with the fork changes."
          fi
